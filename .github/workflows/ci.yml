name: ci

# Build gate: make sure the app compiles on every push / PR to main.
# Releases are handled separately by release.yml (on tags).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build PrintBridge.csproj -c Release
