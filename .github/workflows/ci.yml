name: ci

# Build gate: make sure the app compiles on every push / PR to main.
# Releases are handled separately by release.yml (on tags).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build PrintBridge.csproj -c Release
